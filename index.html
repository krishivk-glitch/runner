[['box',0xc9a066],['arch',0x4c9a2a],['pyr',0xd4a15a],['cart',0xb5835a],['cone',0x6d4c41],['gate',0x4c9a2a]],

[['box',0x3b1a14,0xaa3300],['arch',0xffc107,0x885500],['rock',0x1a1a1a,0x661800],['cart',0x663311,0xaa3300],['cone',0xff5a1f,0xaa3300],['gate',0xffc107,0x885500]],
[['cy',0xbfe9ff,0x335566],['arch',0x7fc8f0,0x224455],['cry',0x9ad0ff,0x335577],['cart',0x3b5bdb],['cone',0xe8f6ff,0x335566],['gate',0x7fc8f0,0x224455]]];
